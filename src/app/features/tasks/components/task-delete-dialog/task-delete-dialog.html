<h2 mat-dialog-title>Excluir tarefa?</h2>

<mat-dialog-content>
  <p>
    A tarefa <strong>“{{ task.title }}”</strong> será removida permanentemente. Essa ação não pode
    ser desfeita.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button class="delete-button" type="button" (click)="confirm()">Excluir</button>
</mat-dialog-actions>
